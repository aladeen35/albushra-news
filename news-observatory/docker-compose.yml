# البشرى للأخبار / Al-Bushra News: docker compose up -d --build
# api serves the site and the API; worker runs the ingestion schedule. Exactly
# one worker: two would double every provider call against the quota.
name: news-observatory

x-app: &app
  build: {context: ., dockerfile: backend/Dockerfile}
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+psycopg://observatory:${POSTGRES_PASSWORD:-observatory}@postgres:5432/observatory
  depends_on:
    postgres: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatory}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory -d observatory"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://observatory:${POSTGRES_PASSWORD:-observatory}@postgres:5432/observatory
      SCHEDULER_ENABLED: "false"  # the worker runs the hourly jobs
    ports: ["8090:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "app.cli", "worker"]

volumes:
  pg-data:
