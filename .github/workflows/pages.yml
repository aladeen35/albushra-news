name: البشرى للأخبار — النشر على GitHub Pages

# Fetch real news and figures, build the read-only site and publish it on
# GitHub Pages (branch gh-pages). The schedule wakes every 5 minutes; a quick
# check then builds only when the interval chosen in the admin page
# (content/settings.json, default 20 minutes) has passed since the last
# publish. Saves from the admin page and manual runs always build.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]   # includes every save from the admin page (content/)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.due.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            content
            news-observatory/backend
      - name: هل حان وقت الجلب؟
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_DIR: content
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          export LAST_PUBLISHED="$(gh api "repos/${{ github.repository }}/commits/gh-pages" --jq .commit.committer.date 2>/dev/null || true)"
          export OTHER_RUNS="$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?status=in_progress" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)"
          python3 news-observatory/backend/scripts/schedule_check.py >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: news-observatory/backend
    env:
      SCHEDULER_ENABLED: 'false'
      DATABASE_URL: sqlite:///./data/pages.db
      HDX_APP_NAME: albushra-news
      HDX_APP_EMAIL: albushra-news@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news-observatory/backend/requirements-dev.txt

      - name: تثبيت المتطلبات والاختبارات
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q -p no:warnings

      # Real news and figures, plus what editors saved from the admin page
      # (the content/ folder), built into the static site.
      - name: جلب البيانات وتطبيق تعديلات الإدارة وبناء الموقع
        env:
          CONTENT_DIR: ../../content
          CONTENT_PATH: content
          PAGES_WORKFLOW: pages.yml
        run: python scripts/build_pages.py ../../site

      - name: النشر على فرع gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Site rebuilt with real data"
