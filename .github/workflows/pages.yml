name: البشرى للأخبار — النشر على GitHub Pages

# Every hour: fetch real news from the sources, build the read-only site and
# publish it on GitHub Pages (branch gh-pages).
on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-observatory/backend
    env:
      SCHEDULER_ENABLED: 'false'
      DATABASE_URL: sqlite:///./data/pages.db
      HDX_APP_NAME: albushra-news
      HDX_APP_EMAIL: albushra-news@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news-observatory/backend/requirements-dev.txt

      - name: تثبيت المتطلبات والاختبارات
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q -p no:warnings

      - name: جلب الأخبار والمؤشرات الحقيقية
        run: |
          python -m app.cli ingest-news | tail -40
          python -m app.cli ingest-metrics | tail -20

      - name: بناء الموقع الثابت
        run: |
          python scripts/export_static.py ../../site
          python -c "import json; print(len(json.load(open('../../site/data/articles.json'))), 'stories in the site')"

      - name: النشر على فرع gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Site rebuilt with real data"
