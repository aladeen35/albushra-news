name: مؤقت — التحقق من الأرقام من مصادرها

# Temporary: prints the sentences that carry the figures, verbatim from the
# publishers' pages, so the first figures entered are checked against the source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Read the pages
        shell: python
        run: |
          import re, subprocess, urllib.request, html
          URLS = [
            "https://www.ochaopt.org/content/humanitarian-situation-report-2-october-2026",
            "https://www.ochaopt.org/content/humanitarian-situation-report-25-september-2026",
            "https://www.ochaopt.org/publications/snapshots",
            "https://www.ochaopt.org/data/casualties",
            "https://dtm.iom.int/reports/dtm-sudan-displacement-and-return-snapshot-9",
            "https://dtm.iom.int/sudan",
            "https://www.un.org/unispal/wp-content/uploads/2025/12/OPT_Flash_Appeal_2026_At_a_Glance_EN.pdf",
            "https://www.unrwa.org/resources/reports/unrwa-situation-report-230-humanitarian-crisis-gaza-strip-and-occupied-west-bank",
          ]
          KEY = re.compile(r"(killed|fatalit|injur|displaced|returnee|returned|people in need|in need of)", re.I)
          for url in URLS:
              print("\n=====", url)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; AlBushraNews/1.0; figures check)"})
                  data = urllib.request.urlopen(req, timeout=40).read()
              except Exception as e:
                  print("FAILED:", e); continue
              if url.endswith(".pdf"):
                  open("/tmp/x.pdf", "wb").write(data)
                  text = subprocess.run(["pdftotext", "-layout", "/tmp/x.pdf", "-"], capture_output=True, text=True).stdout
              else:
                  text = data.decode("utf-8", "replace")
                  for m in re.finditer(r'href="([^"]*snapshot[^"]*)"', text): print("LINK", m.group(1))
                  text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", text, flags=re.S)
                  text = html.unescape(re.sub(r"<[^>]+>", " ", text))
              m = re.search(r"(Published|Issued|Date)[^\n]{0,80}", text)
              if m: print("DATE:", " ".join(m.group(0).split()))
              seen = 0
              for s in re.split(r"(?<=[.!?])\s+|\n{2,}", text):
                  s = " ".join(s.split())
                  if KEY.search(s) and re.search(r"\d", s) and 20 < len(s) < 600:
                      print("-", s); seen += 1
                      if seen >= 40: break
