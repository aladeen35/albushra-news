name: مؤقت — التحقق من الأرقام من مصادرها

# Temporary: prints the sentences that carry the figures, verbatim from the
# publishers' pages, so the first figures entered are checked against the source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null || true
      - name: Read the pages
        shell: python
        run: |
          import re, subprocess, urllib.request, html
          URLS = [
            "https://www.ochaopt.org/sites/default/files/Gaza_Reported_Impact_Snapshot_30_September_2026.pdf",
            "https://www.ochaopt.org/sites/default/files/West%20Bank_info-graphic_14_September_2026.pdf",
            "https://reliefweb.int/updates/rss.xml?search=%22Displacement%20and%20Return%20Snapshot%22",
          ]
          KEY = re.compile(r"(killed|fatalit|injur|displaced|returnee|returned|people in need|in need of)", re.I)
          for url in URLS:
              print("\n=====", url)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; AlBushraNews/1.0; figures check)"})
                  data = urllib.request.urlopen(req, timeout=40).read()
              except Exception as e:
                  print("FAILED:", e); continue
              if "rss.xml" in url:
                  for t, l in re.findall(r"<title>(.*?)</title>\s*<link>(.*?)</link>", data.decode("utf-8", "replace"))[:15]: print("ITEM", t, l)
                  continue
              if url.endswith(".pdf"):
                  open("/tmp/x.pdf", "wb").write(data)
                  text = subprocess.run(["pdftotext", "-layout", "/tmp/x.pdf", "-"], capture_output=True, text=True).stdout
              else:
                  text = data.decode("utf-8", "replace")
                  for m in re.finditer(r'href="([^"]*(?:snapshot|attachments|\.pdf)[^"]*)"', text): print("LINK", m.group(1))
                  text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", text, flags=re.S)
                  text = html.unescape(re.sub(r"<[^>]+>", " ", text))
              m = re.search(r"(Published|Issued|Date)[^\n]{0,80}", text)
              if m: print("DATE:", " ".join(m.group(0).split()))
              seen = 0
              parts = text.splitlines() if url.endswith(".pdf") else re.split(r"(?<=[.!?])\s+|\n{2,}", text)
              for s in parts:
                  s = " ".join(s.split())
                  if KEY.search(s) and re.search(r"\d", s) and 20 < len(s) < 600:
                      print("-", s); seen += 1
                      if seen >= 60: break
